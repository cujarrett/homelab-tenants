apiVersion: platform.local.lab/v1alpha1
kind: Spa
metadata:
  name: connections-demo
  namespace: platform-connections-demo
spec:
  parameters:
    image: ghcr.io/cujarrett/platform-connections-demo-spa:sha-c163aab453feeecd15da70cd3a74a0830ada7ce7
    repo: https://github.com/cujarrett/platform-connections-demo
    host: connections.mattjarrett.dev
    tlsIssuer: letsencrypt-prod
    replicas: 1
    size: xs
    contentSecurityPolicy: "default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self';"
    apiProxies:
      - path: /authorized/
        app: authorized-api
      - path: /unauthorized/
        app: unauthorized-api
