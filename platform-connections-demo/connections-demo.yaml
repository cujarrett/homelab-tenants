apiVersion: platform.local.lab/v1alpha1
kind: Spa
metadata:
  name: connections-demo
spec:
  parameters:
    namespace: platform-connections-demo
    image: ghcr.io/cujarrett/platform-connections-demo-spa:sha-8f427d8fc81fd6ed425896fb946ee61b83ee7f2b
    repo: https://github.com/cujarrett/platform-connections-demo
    host: connections.mattjarrett.dev
    tlsIssuer: letsencrypt-prod
    replicas: 1
    size: xs
    connectionPosture: enforce
    contentSecurityPolicy: "default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self';"
    apiProxies:
      - path: /authorized/
        upstream: authorized-api.platform-connections-demo.svc.cluster.local
      - path: /unauthorized/
        upstream: unauthorized-api.platform-connections-demo.svc.cluster.local
