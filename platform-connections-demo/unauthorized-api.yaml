apiVersion: platform.local.lab/v1alpha1
kind: Api
metadata:
  name: unauthorized-api
spec:
  parameters:
    namespace: platform-connections-demo
    image: ghcr.io/cujarrett/platform-connections-demo-downstream:sha-af66bb352bf4321d0b1d66eddfb9b447ffd0f914
    repo: https://github.com/cujarrett/platform-connections-demo
    port: 8080
    replicas: 1
    connectionPosture: enforce
    # Same image as authorized-api. Declares its way out, then upstream-api refuses it.
    # Drop this consumes and the call dies at gate 1 as a 502 - red for the wrong reason.
    consumes:
      - { namespace: platform-connections-demo, app: upstream-api }
    provides:
      - name: demo
        allowedCallers:
          - { namespace: platform-connections-demo, app: connections-demo }
