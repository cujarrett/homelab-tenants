apiVersion: platform.local.lab/v1alpha1
kind: Api
metadata:
  name: authorized-api
spec:
  parameters:
    namespace: platform-connections-demo
    image: ghcr.io/cujarrett/platform-connections-demo-downstream:sha-678f455d12d2740655857d26572afbb931a14109
    repo: https://github.com/cujarrett/platform-connections-demo
    port: 8080
    replicas: 1
    connectionPosture: enforce
    # AWS endpoints are not declared in consumes - binding to a resource is the
    # declaration, so the platform registers S3, DynamoDB and the credential
    # endpoints from these two refs alone.
    objectStorageRefs:
      - name: assets
    nosqlRef:
      name: records
    # Out is declared here, in is granted on upstream-api. Both must hold.
    provides:
      - name: demo
        allowedCallers:
          - { namespace: platform-connections-demo, app: connections-demo }
    consumes:
      - { host: api.open-meteo.com }
      - { namespace: platform-connections-demo, app: upstream-api }
