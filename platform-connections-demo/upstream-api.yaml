apiVersion: platform.local.lab/v1alpha1
kind: Api
metadata:
  name: upstream-api
spec:
  parameters:
    namespace: platform-connections-demo
    image: ghcr.io/cujarrett/platform-connections-demo-api:sha-bf938b8d4c29035acd7760954b53abca6fb1727b
    repo: https://github.com/cujarrett/platform-connections-demo
    port: 8080
    replicas: 1
    connectionPosture: enforce
    # No host, so nothing but a declared caller can reach this API.
    provides:
      - name: data
        allowedCallers:
          - { namespace: platform-connections-demo, app: authorized-api }
