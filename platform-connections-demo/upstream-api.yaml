apiVersion: platform.local.lab/v1alpha1
kind: Api
metadata:
  name: upstream-api
spec:
  parameters:
    namespace: platform-connections-demo
    image: ghcr.io/cujarrett/platform-connections-demo-api:sha-b780fe88df8ffff046f7b8f7d24db2c28f8414a4
    repo: https://github.com/cujarrett/platform-connections-demo
    port: 8080
    replicas: 1
    connectionPosture: enforce
    entra:
      enabled: true
      roles:
        - name: Data.Read
          allowedCallers:
            - { namespace: platform-connections-demo, app: authorized-api }
    # No host, so nothing but a declared caller can reach this API.
    provides:
      - name: data
        paths: ["/api/v1/data"]
        allowedCallers:
          - { namespace: platform-connections-demo, app: authorized-api }
      # Letting unauthorized-api in here is the point - the mesh stops separating the
      # two so the refusal comes from Entra. Drop it and the demo shows a 403 from the
      # wrong gate.
      - name: protected
        paths: ["/api/v1/protected"]
        allowedCallers:
          - { namespace: platform-connections-demo, app: authorized-api }
          - { namespace: platform-connections-demo, app: unauthorized-api }
