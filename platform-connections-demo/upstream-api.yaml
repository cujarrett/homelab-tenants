apiVersion: platform.local.lab/v1alpha1
kind: Api
metadata:
  name: upstream-api
spec:
  parameters:
    namespace: platform-connections-demo
    image: ghcr.io/cujarrett/platform-connections-demo-api:sha-ee188474bedad11ed816b9456e0cc54763087a9a
    repo: https://github.com/cujarrett/platform-connections-demo
    port: 8080
    replicas: 1
    connectionPosture: enforce
    entra:
      enabled: true
      roles:
        - name: Data.Read
          allowedCallers:
            - { namespace: platform-connections-demo, app: authorized-api }
        # Offered, and held by nobody. Being let in is not the same as being allowed
        # to do everything once inside.
        - name: Data.Admin
          allowedCallers: []
    # No host, so nothing but a declared caller can reach this API.
    provides:
      - name: data
        allowedCallers:
          - { namespace: platform-connections-demo, app: authorized-api }
