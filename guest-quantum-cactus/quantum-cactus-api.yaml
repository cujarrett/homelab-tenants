apiVersion: platform.local.lab/v1alpha1
kind: Api
metadata:
  name: quantum-cactus-api
spec:
  parameters:
    namespace: guest-quantum-cactus
    image: ghcr.io/cujarrett/hello-world-api:latest
    port: 8080
    replicas: 1
    host: demo5-api.mattjarrett.dev
    tlsSecret: demo5-api-tls
    sqlRef:
      name: quantum-cactus-sql
      backend: private-cloud
    objectStorageRefs:
      - name: quantum-cactus-store
    cache:
      enabled: true
      backend: private-cloud
    readinessCheckPath: /readyz
