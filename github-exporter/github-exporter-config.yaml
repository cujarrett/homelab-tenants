apiVersion: v1
kind: ConfigMap
metadata:
  name: github-exporter-config
  namespace: github-exporter
  annotations:
    # Ahead of the XR, which mounts this as environment and will not start without it.
    argocd.argoproj.io/sync-wave: "-1"
data:
  GITHUB_ORG: cujarrett
  # The calendar-day merge count has to roll over when the dashboard's readers do.
  TZ: America/Chicago
