apiVersion: platform.local.lab/v1alpha1
kind: Api
metadata:
  name: github-exporter
  namespace: github-exporter
spec:
  parameters:
    image: ghcr.io/cujarrett/github-exporter:sha-1133de1874cc63f09c45065135a8ec9035d5dba4
    port: 8080
    # Serves metrics on the traffic port, so the default 9090 would scrape nothing.
    metricsPort: 8080
    consumes:
      - { host: api.github.com }
    configFrom:
      - github-exporter-config
    secretsFrom:
      - github-exporter-token
