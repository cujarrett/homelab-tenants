apiVersion: platform.local.lab/v1alpha1
kind: Api
metadata:
  name: chrome-spatula-api
  annotations:
    # AWS binding secrets need a second render pass to pick up the RolesAnywhere
    # profile ARN. Crossplane's 1m default poll made most sandboxes wait a full
    # extra minute for that pass - this bounds the wait to 5s.
    crossplane.io/poll-interval: "5s"
spec:
  parameters:
    namespace: guest-chrome-spatula
    image: ghcr.io/cujarrett/hello-world-api:latest
    port: 8080
    replicas: 1
    host: demo4-api.mattjarrett.dev
    tlsSecret: demo4-api-tls
    readinessCheckPath: /readyz
