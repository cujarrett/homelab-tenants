apiVersion: v1
kind: Namespace
metadata:
  name: launchpad
  # NOT meshed: launchpad-api (BFF) holds long-lived K8s watch streams on every platform XR
  # kind (watcher.go) to power the UI's live status (SSE), plus apiserver/GitHub calls to
  # provision sandboxes. The istio-proxy sidecar intercepts apiserver :443 and cuts those
  # long-lived watch streams ("watch channel closed, restarting"), so it stays unmeshed.
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  annotations:
    # Prune after the XRs. A namespace that starts terminating while managed
    # resources still hold finalizers deadlocks and never finishes.
    argocd.argoproj.io/sync-wave: "-1"
