apiVersion: platform.local.lab/v1alpha1
kind: Api
metadata:
  name: weather-exporter
spec:
  parameters:
    namespace: sump-pump
    image: ghcr.io/cujarrett/weather-exporter:sha-baf0a7087db45dd5ee153af16293a372bd0c5199
    repo: https://github.com/cujarrett/weather-exporter
    port: 8080
    metricsPort: 8080
    connectionPosture: enforce
    # The only call it makes. Nothing else on the internet is reachable.
    consumes:
      - { host: api.open-meteo.com }
