apiVersion: platform.local.lab/v1alpha1
kind: Api
metadata:
  name: weather-exporter
  namespace: sump-pump
spec:
  parameters:
    image: ghcr.io/cujarrett/weather-exporter:sha-cd5767e139ac10d7b5e72906c8838878a45378cc
    repo: https://github.com/cujarrett/weather-exporter
    port: 8080
    metricsPort: 8080
