apiVersion: platform.local.lab/v1alpha1
kind: Api
metadata:
  name: sump-pump-bridge
spec:
  parameters:
    namespace: sump-pump
    image: ghcr.io/cujarrett/sump-pump-bridge:sha-3f718e2f3d6342408d7c6433f6c29cd138bb2994
    repo: https://github.com/cujarrett/sump-pump-bridge
    port: 8080
    host: sump-pump-bridge.local.lab
    tlsIssuer: local-lab-ca-issuer
    # off until the platform can declare a bare LAN IP. This bridge calls the Shelly
    # device at 192.168.10.188 directly, and consumes.host renders a DNS ServiceEntry,
    # which cannot express an address. Under enforce that call is blackholed at gate 1.
    connectionPosture: "off"
    topicRef:
      name: home-appliances
    secretRef:
      name: sump-pump-bridge-config
