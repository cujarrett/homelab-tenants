apiVersion: platform.local.lab/v1alpha1
kind: Api
metadata:
  name: sump-pump-bridge
  namespace: sump-pump
spec:
  parameters:
    image: ghcr.io/cujarrett/sump-pump-bridge:sha-6aeaa093e39514f8e67918266cdad05f01bec53f
    repo: https://github.com/cujarrett/sump-pump-bridge
    port: 8080
    host: sump-pump-bridge.local.lab
    tlsIssuer: local-lab-ca-issuer
    # The Shelly device has no DNS name, so this is declared by address. A host
    # entry would render a DNS ServiceEntry, which cannot resolve a bare IP.
    consumes:
      - { address: 192.168.10.188, port: 80, protocol: HTTP }
    topicRef:
      name: home-appliances
    configFrom: [sump-pump-bridge-config]
